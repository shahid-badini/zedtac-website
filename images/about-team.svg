<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9480F"/>
      <stop offset="55%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#FF9A3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="700" height="700" fill="url(#g)"/>
  <rect width="700" height="700" fill="url(#glow)"/>
  <circle cx="620" cy="600" r="180" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="70" cy="90" r="130" fill="#FFFFFF" opacity="0.07"/>

  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.4">
    <circle cx="350" cy="350" r="240"/>
    <circle cx="350" cy="350" r="310"/>
  </g>

  <!-- laptop / workspace motif -->
  <g transform="translate(180,260)">
    <rect x="0" y="0" width="340" height="200" rx="14" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="18" y="18" width="304" height="130" rx="6" fill="#FFE3CC"/>
    <rect x="34" y="34" width="140" height="12" rx="6" fill="#FF9A3D"/>
    <rect x="34" y="58" width="272" height="8" rx="4" fill="#FFD8B0"/>
    <rect x="34" y="74" width="220" height="8" rx="4" fill="#FFD8B0"/>
    <rect x="34" y="96" width="90" height="40" rx="8" fill="#D9480F"/>
    <rect x="132" y="96" width="90" height="40" rx="8" fill="#FF7A1A"/>
    <rect x="230" y="96" width="76" height="40" rx="8" fill="#FF9A3D"/>
    <rect x="-14" y="200" width="368" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.75"/>

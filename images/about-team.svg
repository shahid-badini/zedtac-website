  <g fill="#FFFFFF" fill-opacity="0.92" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700">
    <text x="180" y="512">Built by a team that</text>
    <text x="180" y="546">ships and supports.</text>
